<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arathy &amp; Nikhil — Wedding Invitation · 20 August 2026</title>
  <meta name="description" content="You are warmly invited to celebrate the wedding of Arathy &amp; Nikhil on 20 August 2026."/>
  <meta property="og:title" content="Arathy & Nikhil — Wedding Invitation"/>
  <meta property="og:description" content="Join us on 20 August 2026 at St. Augustine's Church Parish Hall, Kalloorkad."/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <!-- React 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- canvas-confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* ================================================================
       ROOT DESIGN TOKENS
    ================================================================ */
    :root {
      --sage:       #7C9A6B;
      --sage-l:     #A8C49A;
      --sage-p:     #C8DDB8;
      --blush:      #F2C4C4;
      --blush-d:    #D4686E;
      --rose:       #C4464C;
      --rose-l:     #E88A8E;
      --gold:       #C9A96E;
      --gold-l:     #E8D5A3;
      --gold-d:     #A0823E;
      --cream:      #FBF7F2;
      --cream-d:    #F2E8D8;
      --charcoal:   #2E2016;
      --midnight:   #18183A;
      --burgundy:   #2D0F1C;
      --forest:     #0F2A18;
      --warm-grey:  #8B7A6A;
    }

    /* ================================================================
       RESET & BASE
    ================================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      background: #FBF7F2;
      color: var(--charcoal);
    }

    /* ================================================================
       ANIMATED GRADIENT BACKGROUND
    ================================================================ */
    #gradient-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(
        135deg,
        #FFF0F3 0%,
        #FCEEE8 20%,
        #F0F8EC 40%,
        #FFF8E8 60%,
        #F5EBF5 80%,
        #FFF0F3 100%
      );
      background-size: 400% 400%;
      animation: bgPulse 20s ease infinite;
    }

    @keyframes bgPulse {
      0%,100% { background-position: 0% 50%; }
      25%      { background-position: 100% 0%; }
      50%      { background-position: 100% 100%; }
      75%      { background-position: 0% 100%; }
    }

    /* ================================================================
       LOADING SCREEN
    ================================================================ */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--burgundy);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #loading-screen.done { opacity: 0; visibility: hidden; }
    .loading-monogram {
      font-family: 'Great Vibes', cursive;
      font-size: 5rem;
      color: var(--gold);
      animation: loadPulse 1.5s ease infinite;
    }
    .loading-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      color: var(--blush);
      text-transform: uppercase;
    }
    @keyframes loadPulse {
      0%,100% { opacity: 0.6; transform: scale(0.97); }
      50%      { opacity: 1; transform: scale(1.03); }
    }

    /* ================================================================
       PETAL CANVAS
    ================================================================ */
    #petal-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ================================================================
       FLOATING DECORATIONS
    ================================================================ */
    .float-deco {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      font-size: 1.4rem;
      will-change: transform;
      opacity: 0.7;
    }
    @keyframes floatPath1 {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      20%  { transform: translate(40px, -60px) rotate(20deg) scale(1.1); }
      50%  { transform: translate(80px, -20px) rotate(-15deg) scale(0.9); }
      80%  { transform: translate(30px, 40px) rotate(25deg) scale(1.05); }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    }
    @keyframes floatPath2 {
      0%   { transform: translate(0, 0) rotate(0deg); }
      30%  { transform: translate(-50px, -40px) rotate(-20deg); }
      60%  { transform: translate(-80px, 20px) rotate(15deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes floatPath3 {
      0%,100% { transform: translateY(0) rotate(0deg) scale(1); }
      33%      { transform: translateY(-50px) rotate(30deg) scale(1.15); }
      66%      { transform: translateY(30px) rotate(-20deg) scale(0.9); }
    }

    /* ================================================================
       NAV DOTS
    ================================================================ */
    #nav-dots {
      position: fixed;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      z-index: 500;
    }
    .nav-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    .nav-dot.active, .nav-dot:hover {
      background: var(--gold);
      transform: scale(1.4);
      box-shadow: 0 0 10px var(--gold);
    }
    .nav-dot-tip {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(45,15,28,0.9);
      color: var(--gold-l);
      font-family: 'Poppins', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
      padding: 3px 8px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .nav-dot:hover .nav-dot-tip { opacity: 1; }
    @media (max-width: 640px) { #nav-dots { display: none; } }

    /* ================================================================
       MUSIC TOGGLE
    ================================================================ */
    #music-btn {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      z-index: 500;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--burgundy), #4A1028);
      border: 2px solid var(--gold);
      color: var(--gold);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }
    #music-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(201,169,110,0.5); }
    #music-btn.playing {
      background: linear-gradient(135deg, var(--sage), var(--sage-l));
      border-color: var(--sage-l);
      animation: musicPulse 2s ease infinite;
    }
    @keyframes musicPulse {
      0%,100% { box-shadow: 0 4px 20px rgba(124,154,107,0.4); }
      50%      { box-shadow: 0 0 30px rgba(124,154,107,0.8), 0 0 60px rgba(124,154,107,0.3); }
    }

    /* ================================================================
       SHARE / SAVE BUTTONS
    ================================================================ */
    #action-btns {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .btn-share {
      background: linear-gradient(135deg, var(--rose), var(--blush-d));
      color: white;
    }
    .btn-save {
      background: linear-gradient(135deg, var(--sage), var(--sage-l));
      color: white;
    }
    .action-btn:hover { transform: translateY(-2px) scale(1.05); }

    /* ================================================================
       SECTION COMMON
    ================================================================ */
    section {
      position: relative;
      z-index: 2;
      padding: 5rem 1.5rem;
      overflow: hidden;
    }
    .section-inner {
      max-width: 860px;
      margin: 0 auto;
    }

    /* FLORAL BORDERS inside sections */
    .floral-top, .floral-bottom {
      width: 100%;
      display: block;
      pointer-events: none;
    }
    .floral-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      max-height: 220px;
      object-fit: cover;
      object-position: top center;
      z-index: 1;
    }
    .floral-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      max-height: 180px;
      object-fit: cover;
      object-position: bottom center;
      z-index: 1;
    }

    /* Ornament line */
    .ornament {
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .ornament::before, .ornament::after {
      content: '';
      flex: 1;
      max-width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .ornament-icon { color: var(--gold); font-size: 1.2rem; }

    /* Section headings */
    .sec-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 6vw, 3rem);
      text-align: center;
      font-weight: 600;
    }
    .sec-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 3vw, 1.25rem);
      text-align: center;
      margin-top: 0.3rem;
    }

    /* ================================================================
       SCROLL REVEAL
    ================================================================ */
    .sr {
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 0.9s cubic-bezier(0.25,0.46,0.45,0.94),
                  transform 0.9s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .sr.sr-left  { transform: translateX(-60px); }
    .sr.sr-right { transform: translateX(60px); }
    .sr.sr-scale { transform: scale(0.8); }
    .sr.visible  { opacity: 1; transform: translate(0) scale(1); }
    .sr.d1 { transition-delay: 0.1s; }
    .sr.d2 { transition-delay: 0.2s; }
    .sr.d3 { transition-delay: 0.35s; }
    .sr.d4 { transition-delay: 0.5s; }
    .sr.d5 { transition-delay: 0.65s; }
    .sr.d6 { transition-delay: 0.8s; }

    /* ================================================================
       SECTION 1 — HERO
    ================================================================ */
    #hero {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0;
      background: linear-gradient(160deg, #2D0F1C 0%, #1A0F28 50%, #0F1A28 100%);
      position: relative;
    }

    .hero-floral-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      object-position: top center;
      z-index: 2;
      opacity: 0.9;
    }
    .hero-floral-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      object-position: bottom center;
      z-index: 2;
      opacity: 0.9;
      transform: scaleX(-1);
    }

    /* Star field in hero */
    .hero-stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--dur, 3s) ease infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.1; transform: scale(0.8); }
      50%      { opacity: 0.9; transform: scale(1.2); }
    }

    .hero-content {
      position: relative;
      z-index: 3;
      padding: 2rem 1.5rem;
      margin-top: 160px;
      margin-bottom: 160px;
    }

    /* Monogram */
    .hero-monogram {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(5rem, 20vw, 10rem);
      color: var(--gold);
      line-height: 1;
      cursor: pointer;
      display: inline-block;
      animation: monogramReveal 2s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
      opacity: 0;
      text-shadow:
        0 0 30px rgba(201,169,110,0.6),
        0 0 60px rgba(201,169,110,0.3),
        0 4px 20px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }
    .hero-monogram:hover { transform: scale(1.08); }
    .hero-monogram.burst { animation: burstScale 0.5s ease forwards; }

    @keyframes monogramReveal {
      0%   { opacity: 0; transform: scale(0.3) rotate(-15deg); filter: blur(20px); }
      60%  { opacity: 1; transform: scale(1.08) rotate(3deg);  filter: blur(0); }
      100% { opacity: 1; transform: scale(1) rotate(0deg);     filter: blur(0); }
    }
    @keyframes burstScale {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.25) rotate(5deg); }
      60%  { transform: scale(0.95) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .hero-together {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      color: var(--blush);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.5rem;
      opacity: 0;
      animation: fadeUp 1s 0.8s ease forwards;
    }

    .hero-names {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3rem, 12vw, 6.5rem);
      color: white;
      line-height: 1.15;
      margin-top: 0.3rem;
      opacity: 0;
      animation: fadeUp 1.2s 1.4s ease forwards;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .hero-amp {
      color: var(--rose-l);
      font-size: 0.65em;
    }

    .hero-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.15em;
      margin-top: 0.5rem;
      font-style: italic;
      opacity: 0;
      animation: fadeUp 1s 2s ease forwards;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      margin-top: 1.8rem;
      padding: 0.6rem 2rem;
      border: 1px solid var(--gold);
      border-radius: 50px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--gold-l);
      letter-spacing: 0.12em;
      opacity: 0;
      animation: fadeUp 1s 2.5s ease forwards;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(4px);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      opacity: 0;
      animation: fadeUp 1s 3.2s ease forwards;
    }
    .scroll-indicator span {
      font-family: 'Poppins', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    .scroll-arrow {
      width: 22px;
      height: 22px;
      border-right: 2px solid rgba(201,169,110,0.7);
      border-bottom: 2px solid rgba(201,169,110,0.7);
      transform: rotate(45deg);
      animation: scrollBounce 1.5s ease infinite;
    }
    @keyframes scrollBounce {
      0%,100% { transform: rotate(45deg) translateY(0); }
      50%      { transform: rotate(45deg) translateY(6px); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ================================================================
       SECTION 2 — COUPLE
    ================================================================ */
    #couple {
      background: linear-gradient(170deg, var(--cream) 0%, #FEF0F0 100%);
      padding-top: 7rem;
      padding-bottom: 7rem;
    }

    .couple-grid {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      gap: 1rem;
      align-items: start;
      margin-top: 2.5rem;
    }
    @media (max-width: 640px) {
      .couple-grid {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .couple-amp { order: 1; margin: 0.5rem auto; }
      .couple-card:first-child { order: 0; }
      .couple-card:last-child  { order: 2; }
    }

    .couple-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      border-radius: 1.2rem;
      padding: 2.5rem 1.8rem;
      border: 1px solid var(--blush);
      box-shadow: 0 8px 40px rgba(212,104,110,0.1);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      position: relative;
      overflow: hidden;
    }
    .couple-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(242,196,196,0.15), transparent 60%);
      pointer-events: none;
    }
    .couple-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(212,104,110,0.2);
    }

    .couple-name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.5rem, 9vw, 4rem);
      color: var(--blush-d);
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .couple-role-badge {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: white;
      background: linear-gradient(135deg, var(--rose), var(--blush-d));
      padding: 0.2rem 0.9rem;
      border-radius: 50px;
      margin-bottom: 1rem;
    }
    .couple-relation {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 0.3rem;
    }
    .couple-parents {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--charcoal);
      line-height: 1.8;
    }
    .couple-address {
      font-family: 'Poppins', sans-serif;
      font-size: 0.72rem;
      color: var(--warm-grey);
      margin-top: 0.8rem;
      font-style: italic;
      line-height: 1.7;
    }

    .couple-amp {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3rem, 10vw, 5rem);
      color: var(--gold);
      text-align: center;
      line-height: 1;
      align-self: center;
      text-shadow: 0 0 20px rgba(201,169,110,0.4);
    }

    .invite-line {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      color: var(--blush-d);
      text-align: center;
      margin-top: 2.5rem;
      padding: 1.2rem 2rem;
      border: 1px dashed var(--blush);
      border-radius: 0.8rem;
      background: rgba(255,255,255,0.5);
    }

    /* ================================================================
       SECTION 3 — COUNTDOWN
    ================================================================ */
    #countdown {
      background: linear-gradient(160deg, #18183A 0%, #2D0F1C 50%, #0F1820 100%);
      padding-top: 6rem;
      padding-bottom: 6rem;
      text-align: center;
    }
    #countdown .sec-heading { color: var(--gold-l); }
    #countdown .sec-sub { color: var(--blush); }

    .countdown-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(0.5rem, 2vw, 1.5rem);
      margin-top: 3rem;
      flex-wrap: wrap;
    }

    .flip-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .flip-card-wrap {
      position: relative;
      width: clamp(70px, 18vw, 110px);
      height: clamp(80px, 22vw, 130px);
      perspective: 400px;
    }

    .flip-card-face {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      color: var(--gold);
      background: linear-gradient(160deg, #26264A, #1C1C38);
      border: 1px solid rgba(201,169,110,0.3);
      backface-visibility: hidden;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.05),
        0 10px 30px rgba(0,0,0,0.4);
      text-shadow: 0 0 20px rgba(201,169,110,0.5);
      overflow: hidden;
    }
    .flip-card-face::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      right: 0;
      height: 1px;
      background: rgba(0,0,0,0.4);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04);
    }

    .flip-top-half, .flip-bot-half {
      position: absolute;
      left: 0; right: 0;
      overflow: hidden;
      border-radius: 12px;
    }
    .flip-top-half {
      top: 0;
      height: 50%;

<!-- Gradient background -->
<div id="gradient-bg" aria-hidden="true"></div>

<!-- Audio -->

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ================================================================
   CONSTANTS
================================================================ */
const WEDDING_UTC = new Date('2026-08-20T05:45:00Z').getTime(); // 11:15 AM IST

/* ================================================================
   HOOKS
================================================================ */
function useCountdown(targetMs) {
  const [tick, setTick] = useState(() => Math.max(0, targetMs - Date.now()));
  useEffect(() => {
    const id = setInterval(() => setTick(Math.max(0, targetMs - Date.now())), 1000);
    return () => clearInterval(id);
  }, [targetMs]);
  const total = tick;
  const secs  = Math.floor(total / 1000) % 60;
  const mins  = Math.floor(total / 60000) % 60;
  const hrs   = Math.floor(total / 3600000) % 24;
  const days  = Math.floor(total / 86400000);
  return { days, hrs, mins, secs };
}

function useInView(ref, options = {}) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold: 0.15, ...options });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return visible;
}

/* ================================================================
   SCROLL REVEAL WRAPPER
================================================================ */
function SR({ children, className = '', delay = 0, direction = '' }) {
  const ref = useRef();
  const vis = useInView(ref);
  const dirClass = direction ? `sr-${direction}` : '';
  return (
    <div
      ref={ref}
      className={`sr ${dirClass} ${vis ? 'visible' : ''} ${className}`}
      style={{ transitionDelay: `${delay}s` }}
    >
      {children}
    </div>
  );
}

/* ================================================================
   FLIP CARD (Countdown unit)
================================================================ */
function FlipCard({ value, label }) {
  const [cur, setCur]       = useState(value);
  const [prev, setPrev]     = useState(value);
  const [flipping, setFlip] = useState(false);
  const str = v => String(v).padStart(2, '0');

  useEffect(() => {
    if (value !== cur) {
      setPrev(cur);
      setFlip(true);
      const t = setTimeout(() => { setCur(value); setFlip(false); }, 600);
      return () => clearTimeout(t);
    }
  }, [value]);

  return (
    <div className="flip-unit">
      <div className="flip-card-wrap" aria-label={`${str(cur)} ${label}`}>
        {/* Static face showing current */}
        <div className="flip-card-face flip-static">{str(cur)}</div>

        {/* Animated halves during flip */}
        {flipping && <>
          {/* Top half showing prev (flips away) */}
          <div className="flip-anim-top">
            <div className="flip-card-face" style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '200%' }}>
              {str(prev)}
            </div>
          </div>
          {/* Bottom half showing new value (reveals) */}
          <div className="flip-anim-bot">
            <div className="flip-card-face" style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: '200%' }}>
              {str(cur)}
            </div>
          </div>
        </>}
      </div>
      <div className="flip-label">{label}</div>
    </div>
  );
}

/* ================================================================
   PETAL CANVAS (canvas-based particles)
================================================================ */
function PetalCanvas() {
  const canvasRef = useRef();

  useEffect(() => {
    const canvas = canvasRef.current || document.getElementById('petal-canvas');
    const ctx = canvas.getContext('2d');
    let W = canvas.width  = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    let raf;

    const colors = [
      '#F2C4C4','#E88A8E','#D4686E','#C9A96E',
      '#F8D5D5','#A8C49A','#E8D5A3','#F4B8C1',
    ];
    const petals = Array.from({ length: window.innerWidth < 640 ? 28 : 50 }, () => ({
      x:    Math.random() * W,
      y:    Math.random() * H - H,
      r:    3 + Math.random() * 7,
      color: colors[Math.floor(Math.random() * colors.length)],
      speed: 0.6 + Math.random() * 1.4,
      drift: (Math.random() - 0.5) * 0.8,
      spin:  (Math.random() - 0.5) * 0.03,
      angle: Math.random() * Math.PI * 2,
      opacity: 0.4 + Math.random() * 0.6,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.02 + Math.random() * 0.03,
    }));

    function draw() {
      ctx.clearRect(0, 0, W, H);
      petals.forEach(p => {
        p.y += p.speed;
        p.wobble += p.wobbleSpeed;
        p.x += p.drift + Math.sin(p.wobble) * 0.5;
        p.angle += p.spin;
        if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
        if (p.x > W + 20) p.x = -20;
        if (p.x < -20)    p.x = W + 20;

        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;

        // Draw petal shape (oval rotated)
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * 0.6, p.r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      raf = requestAnimationFrame(draw);
    }

    draw();

    const resize = () => {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', resize, { passive: true });
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);

  return null; // renders into the existing #petal-canvas
}

/* ================================================================
   FLOATING DECORATIONS (butterflies, flowers)

/* ================================================================
   MUSIC TOGGLE
================================================================ */
function MusicToggle() {
  const [playing, setPlaying] = useState(false);
  const audio = useRef();

  useEffect(() => { audio.current = document.getElementById('bg-audio'); }, []);

  const toggle = async () => {
    if (!playing) {
      try {
        audio.current.volume = 0.2;
        await audio.current.play();
        setPlaying(true);
      } catch(e) { console.log('Audio blocked', e.message); }
    } else {
      audio.current.pause();
      setPlaying(false);
    }
  };

  return (
    <button id="music-btn" className={playing ? 'playing' : ''} onClick={toggle}
      aria-label={playing ? 'Pause music' : 'Play music'} title={playing ? 'Pause' : 'Play music'}>
      {playing ? '🎶' : '🎵'}
    </button>
  );
}

/* ================================================================
   ACTION BUTTONS (Share + Save the Date)
================================================================ */
function ActionButtons() {
  const handleShare = async () => {
    const data = {
      title: 'Arathy & Nikhil — Wedding Invitation',
      text:  'You are invited to our wedding celebration on 20 August 2026! 💍',
      url:   window.location.href,
    };
    if (navigator.share) {
      try { await navigator.share(data); }
      catch(e) { if (e.name !== 'AbortError') fallbackCopy(window.location.href); }
    } else { fallbackCopy(window.location.href); }
  };

  const fallbackCopy = (url) => {
    navigator.clipboard?.writeText(url).then(() => alert('Invitation link copied to clipboard! 🎉'));
  };

  const handleSave = () => {
    const cal = `https://calendar.google.com/calendar/render?action=TEMPLATE` +
      `&text=${encodeURIComponent("Arathy & Nikhil's Wedding")}` +
      `&dates=20260820T054500Z/20260820T090000Z` +
      `&details=${encodeURIComponent("Wedding celebration at St. Augustine's Church Parish Hall, Kalloorkad")}` +
      `&location=${encodeURIComponent("St. Augustine's Church Parish Hall, Kalloorkad, Kerala")}`;
    window.open(cal, '_blank');
  };

  return (
    <div id="action-btns">
      <button className="action-btn btn-share" onClick={handleShare} aria-label="Share invitation">
        📤 Share
      </button>
      <button className="action-btn btn-save" onClick={handleSave} aria-label="Save to calendar">
        📅 Save Date
      </button>
    </div>
  );
}

                  x1="50" y1="50" x2="50" y2="22"

/* ================================================================
   APP (Main)
================================================================ */
function App() {
  const [activeSection, setActiveSection] = useState('hero');

  // Scroll spy
  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) setActiveSection(e.target.id);
      });
    }, { threshold: 0.4 });

    SECTIONS.forEach(s => {
      const el = document.getElementById(s.id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);

  // Monogram click confetti burst
  const handleMonogramClick = useCallback(() => {
    if (typeof confetti === 'undefined') return;
    confetti({
      particleCount: 100,
      spread: 70,
      origin: { x: 0.5, y: 0.35 },
      colors: ['#E8C4C4','#C9A96E','#7C9A6B','#D4686E','#F2C4C4'],
      shapes: ['circle', 'square'],
    });
  }, []);

  return (
    <>
      <PetalCanvas />
      <FloatingDecorations />
      <NavDots active={activeSection} />
      <MusicToggle />
      <ActionButtons />

      <main>
        <HeroSection onMonogramClick={handleMonogramClick} />
        <CoupleSection />
        <CountdownSection />
        <DateTimeSection />
        <VenuesSection />
        <RSVPSection />
        <HostsSection />
        <Footer />
      </main>
    </>
  );
}

/* ================================================================
   RENDER
================================================================ */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Dismiss loading screen
window.addEventListener('load', () => {
  setTimeout(() => {
    const ls = document.getElementById('loading-screen');
    if (ls) ls.classList.add('done');
  }, 800);
});
</script>
</body>
</html>
